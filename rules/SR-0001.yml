uid: SR-0001
type: system_requirement
status: approved
title: Create ephemeral containers
text: >-
  Design the image so the container it defines is ephemeral: it can be stopped and
  destroyed, then rebuilt and replaced with an absolute minimum of setup and
  configuration.

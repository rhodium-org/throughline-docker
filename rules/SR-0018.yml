uid: SR-0018
type: system_requirement
status: proposed
title: Set pipefail before piped commands
text: When a RUN command pipes output between programs, set the shell option pipefail
  first, so the build fails if any stage of the pipe fails rather than only the last.
normative: true
links:
- target: UR-0007
  type: implements
attrs:
  source_ref: 'Docker Dockerfile best practices: RUN — Pipefail'

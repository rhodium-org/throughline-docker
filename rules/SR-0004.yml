uid: SR-0004
type: system_requirement
status: approved
title: Keep the build context small
text: >-
  Keep the build context small by starting from an empty directory and adding only the
  files the Dockerfile needs, so builds are fast and do not send unnecessary files to the
  builder.
links:
- target: UR-0002
  type: implements
attrs:
  source_ref: "Docker Dockerfile best practices: Build Context and dockerignore — Small Context"

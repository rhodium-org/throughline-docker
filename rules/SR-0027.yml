uid: SR-0027
type: system_requirement
status: approved
title: Use an exec helper script for PID 1
text: >-
  When an entrypoint script is needed, end it by exec-ing the main process so that process
  runs as PID 1 and receives Unix signals such as termination correctly.
links:
- target: UR-0012
  type: implements
